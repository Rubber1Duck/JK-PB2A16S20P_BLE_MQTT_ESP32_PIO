; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[global]
board_build.partitions = partitions_custom.csv

[common_env_data]
build_flags =
; Define to print debug output to Serial0
	-D SERIAL_OUT
; Define to use onboard LED signaling (along with LED pin number)
	;-D USELED=48
; Define dual core support
  -D DUALCORE

; Library dependencies
lib_deps = 
	knolleary/PubSubClient@^2.8
	dojyorin/base64_encode@^2.0.4
  h2zero/NimBLE-Arduino@^2.5.1
	; See README.md#build-troubleshooting for details about this pin.
	; Pinned explicitly because newer ESPAsyncWebServer releases can fail in AsyncJson.cpp.
	ESP32Async/ESPAsyncWebServer@3.7.3
	mlesniew/PicoSyslog@^1.1.0

[platformio]
extra_configs = platformio_override.ini

[env:esp32dev-01]
platform = espressif32 @ 7.1.3
board = esp32dev
framework = arduino
lib_deps = 
	${common_env_data.lib_deps}
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_port = COM5
monitor_port = COM5
board_build.partitions = partitions_custom.csv
build_flags = 
	-D DEVICENAME=\"Garage-01\"
  -D CLTNAME=jk-bt-mqtt-01
	${common_env_data.build_flags}

[env:esp32dev-02]
platform = espressif32 @ 7.1.3
board = esp32dev
framework = arduino
lib_deps = 
	${common_env_data.lib_deps}
monitor_speed = 115200
upload_port = COM6
monitor_port = COM6
board_build.partitions = partitions_custom.csv
build_flags = 
	-D DEVICENAME=\"JK-PB2A16S20P-00\"
  -D CLTNAME=jk-bt-mqtt-00
  ${common_env_data.build_flags}

[env:esp32dev-debug]
platform = espressif32 @ 7.1.3
board = esp32dev
framework = arduino
lib_deps = 
	${common_env_data.lib_deps}
monitor_speed = 115200
upload_port = COM5
monitor_port = COM5
board_build.partitions = partitions_custom.csv
build_flags = 
	-D DEVICENAME=\"JK-PB2A16S20P-TEST\"
    -D CLTNAME=jk-bt-mqtt-test
    ${common_env_data.build_flags}
