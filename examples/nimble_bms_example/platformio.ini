; PlatformIO Project Configuration for NimBLE BMS Example
; Standalone example to test BLE Service 0xFFE0 / Characteristic 0xFFE1
; Build & upload with: pio run -e esp32dev -t upload

[global]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32 @ 6.13.0
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_port = COM5
monitor_port = COM5
upload_speed = 921600

lib_deps =
	h2zero/NimBLE-Arduino@^2.5.0

build_flags =
	-D DEVICENAME=\"51210122C200448\"

[env:esp32-S3-N16R8]
platform = espressif32 @ 6.13.0
board = esp32-s3-devkitc-1
framework = arduino
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.psram_type = opi

monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_port = COM5
monitor_port = COM5
upload_speed = 921600

lib_deps =
	h2zero/NimBLE-Arduino@^2.5.0

build_flags =
	-D DEVICENAME=\"51210122C200448\"
